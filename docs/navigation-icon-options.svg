<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">FabricNavigator navigation icon options</title>
  <desc id="desc">Three icon styles for Devices, Topology, and Administration.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f00c7"/><stop offset="1" stop-color="#a24df2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#28104d" flood-opacity=".18"/></filter>
    <style>
      .title{font:800 30px system-ui;fill:#17152b}.subtitle{font:500 16px system-ui;fill:#6c6680}.set{font:800 18px system-ui;fill:#5f00c7}.label{font:750 15px system-ui;fill:#28243b}.card{fill:#fff;stroke:#ded8e9;stroke-width:1.5}.outline{fill:none;stroke:#6820c8;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.lightline{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.minimal{fill:none;stroke:#27223d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.tile{fill:url(#accent)}
    </style>
  </defs>
  <rect width="1200" height="650" rx="28" fill="#f5f3fa"/>
  <text x="54" y="58" class="title">Navigation icon concepts</text>
  <text x="54" y="87" class="subtitle">Devices · Topology · Administration — designed for 36 × 36 px menu buttons</text>

  <text x="54" y="148" class="set">A · Purple outline</text>
  <g transform="translate(250 115)">
    <g transform="translate(0 0)"><rect class="card" filter="url(#shadow)" width="250" height="130" rx="18"/><g transform="translate(96 26)" class="outline"><rect x="2" y="1" width="54" height="17" rx="4"/><rect x="2" y="25" width="54" height="17" rx="4"/><rect x="2" y="49" width="54" height="17" rx="4"/><circle cx="46" cy="9.5" r="2" fill="#6820c8" stroke="none"/><circle cx="46" cy="33.5" r="2" fill="#6820c8" stroke="none"/><circle cx="46" cy="57.5" r="2" fill="#6820c8" stroke="none"/></g><text x="125" y="112" text-anchor="middle" class="label">Devices</text></g>
    <g transform="translate(275 0)"><rect class="card" filter="url(#shadow)" width="250" height="130" rx="18"/><g transform="translate(96 24)" class="outline"><circle cx="7" cy="34" r="7"/><circle cx="51" cy="9" r="7"/><circle cx="51" cy="59" r="7"/><path d="M13 30 44 13M13 38l31 17M51 16v36"/></g><text x="125" y="112" text-anchor="middle" class="label">Topology</text></g>
    <g transform="translate(550 0)"><rect class="card" filter="url(#shadow)" width="250" height="130" rx="18"/><g transform="translate(96 23)" class="outline"><path d="M3 13h52M3 34h52M3 55h52"/><circle cx="19" cy="13" r="6" fill="#fff"/><circle cx="42" cy="34" r="6" fill="#fff"/><circle cx="27" cy="55" r="6" fill="#fff"/></g><text x="125" y="112" text-anchor="middle" class="label">Administration</text></g>
  </g>

  <text x="54" y="335" class="set">B · Filled gradient tiles</text>
  <g transform="translate(250 300)">
    <g><rect class="card" filter="url(#shadow)" width="250" height="130" rx="18"/><rect x="91" y="19" width="68" height="68" rx="16" class="tile"/><g transform="translate(102 29)" class="lightline"><rect x="0" y="0" width="46" height="14" rx="3"/><rect x="0" y="20" width="46" height="14" rx="3"/><rect x="0" y="40" width="46" height="14" rx="3"/><path d="M36 7h3M36 27h3M36 47h3"/></g><text x="125" y="112" text-anchor="middle" class="label">Devices</text></g>
    <g transform="translate(275)"><rect class="card" filter="url(#shadow)" width="250" height="130" rx="18"/><rect x="91" y="19" width="68" height="68" rx="16" class="tile"/><g transform="translate(101 29)" class="lightline"><circle cx="5" cy="27" r="5"/><circle cx="47" cy="6" r="5"/><circle cx="47" cy="48" r="5"/><path d="m10 24 32-15M10 30l32 15M47 11v32"/></g><text x="125" y="112" text-anchor="middle" class="label">Topology</text></g>
    <g transform="translate(550)"><rect class="card" filter="url(#shadow)" width="250" height="130" rx="18"/><rect x="91" y="19" width="68" height="68" rx="16" class="tile"/><g transform="translate(101 29)" class="lightline"><path d="M1 9h48M1 27h48M1 45h48"/><circle cx="16" cy="9" r="5" fill="#7f2ee0"/><circle cx="37" cy="27" r="5" fill="#7f2ee0"/><circle cx="23" cy="45" r="5" fill="#7f2ee0"/></g><text x="125" y="112" text-anchor="middle" class="label">Administration</text></g>
  </g>

  <text x="54" y="522" class="set">C · Neutral</text>
  <g transform="translate(250 487)">
    <g><rect class="card" width="250" height="115" rx="18"/><g transform="translate(101 20)" class="minimal"><path d="M2 3h46v15H2zM2 25h46v15H2zM2 47h46v15H2z"/><path d="M39 10h2M39 32h2M39 54h2"/></g><text x="125" y="98" text-anchor="middle" class="label">Devices</text></g>
    <g transform="translate(275)"><rect class="card" width="250" height="115" rx="18"/><g transform="translate(101 20)" class="minimal"><circle cx="5" cy="31" r="5"/><circle cx="45" cy="7" r="5"/><circle cx="45" cy="55" r="5"/><path d="m10 28 30-18M10 34l30 18M45 12v38"/></g><text x="125" y="98" text-anchor="middle" class="label">Topology</text></g>
    <g transform="translate(550)"><rect class="card" width="250" height="115" rx="18"/><g transform="translate(101 20)" class="minimal"><path d="M1 10h48M1 31h48M1 52h48"/><circle cx="15" cy="10" r="5" fill="#fff"/><circle cx="36" cy="31" r="5" fill="#fff"/><circle cx="22" cy="52" r="5" fill="#fff"/></g><text x="125" y="98" text-anchor="middle" class="label">Administration</text></g>
  </g>
</svg>
