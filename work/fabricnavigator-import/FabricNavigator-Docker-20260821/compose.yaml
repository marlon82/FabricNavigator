services:
  fabricnavigator:
    image: fabricnavigator:2026-08-21
    container_name: fabricnavigator
    entrypoint: ["/bin/sh", "/opt/fabricnavigator/fabricnavigator-entrypoint.sh"]
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      FABRICNAVIGATOR_HTTPS_PORT: "8443"
      FABRICNAVIGATOR_VERSION: "26.09.10.241"
      FABRICNAVIGATOR_IMAGE_REVISION: "20260825-115-dev"
      FABRICNAVIGATOR_GITHUB_REPOSITORY: "${FABRICNAVIGATOR_GITHUB_REPOSITORY:-marlon82/FabricNavigator}"
      FABRICNAVIGATOR_GITHUB_TOKEN_FILE: "/run/secrets/github-update-token.txt"
      FABRICNAVIGATOR_ALLOW_TOKEN_WRITE: "true"
      FABRICNAVIGATOR_UPDATE_DIR: "/opt/fabricnavigator/update"
      ACLI_TERMINAL_REVISION: "20260824-121"
      CATALINA_OPTS: "-Xms128M -Xmx512M -Djava.awt.headless=true -Djava.security.egd=file:/dev/./urandom -Dedm.public.baseUrl=https://localhost:8443"
    ports:
      - "8443:443"
    volumes:
      - ./fabricnavigator-nginx.conf.template:/etc/nginx/templates/fabricnavigator.conf.template:ro
      - ./fabricnavigator-egress.nft:/etc/nftables.d/fabricnavigator-egress.nft:ro
      - ./fabricnavigator-setenv.sh:/opt/tomcat/bin/setenv.sh:ro
      - ./fabricnavigator-entrypoint.sh:/opt/fabricnavigator/fabricnavigator-entrypoint.sh:ro
      - ./route-manager.py:/opt/fabricnavigator/route-manager.py:ro
      - ./webview-proxy.py:/opt/fabricnavigator/webview-proxy.py:ro
      - ./update-coordinator.py:/opt/fabricnavigator/update-coordinator.py:ro
      - ./ssh-probe.pl:/opt/fabricnavigator/ssh-probe.pl:ro
      - ./service-provision.pl:/opt/fabricnavigator/service-provision.pl:ro
      - ../../acli-src/opt/acli/acli.pl:/opt/acli/acli-terminal.pl:ro
      - ../../acli-src/opt/acli/AcliPm/HandleDeviceOutput.pm:/opt/acli/AcliPm/HandleDeviceOutput.pm:ro
      - ../../acli-src/opt/acli/AcliPm/ExitHandlers.pm:/opt/acli/AcliPm/ExitHandlers.pm:ro
      - ./acli-launch.pl:/opt/acli/acli-launch.pl:ro
      - ../../acli-src/opt/acli-web/pty_bridge.py:/opt/acli-web/pty_bridge.py:ro
      - ./acli-default.ini:/opt/acli-web/acli-default.ini:ro
      - ../../../src/java:/opt/fabricnavigator/snmp-src:ro
      - ../../../third_party/snmp4j/snmp4j-2.8.18.jar:/opt/fabricnavigator/snmp4j-2.8.18.jar:ro
      - ../../fabricnavigator-security/fabricnavigator-security.jar:/opt/tomcat/lib/fabricnavigator-security.jar:ro
      - ../../fabricnavigator-rootfs/opt/apache-tomcat-8.0.36/webapps/ROOT/terminal/index.jsp:/opt/tomcat/webapps/ROOT/terminal/index.jsp:ro
      - ../../fabricnavigator-rootfs/opt/apache-tomcat-8.0.36/webapps/ROOT/webview-ticket.jsp:/opt/tomcat/webapps/ROOT/webview-ticket.jsp:ro
      - ../../fabricnavigator-rootfs/opt/apache-tomcat-8.0.36/webapps/ROOT/session-info.jsp:/opt/tomcat/webapps/ROOT/session-info.jsp:ro
      - ../../fabricnavigator-rootfs/opt/apache-tomcat-8.0.36/webapps/ROOT/user-preferences.jsp:/opt/tomcat/webapps/ROOT/user-preferences.jsp:ro
