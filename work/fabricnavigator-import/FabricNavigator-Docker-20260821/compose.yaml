      - ../../fabricnavigator-rootfs/opt/apache-tomcat-8.0.36/webapps/ROOT/assets/user-profile.js:/opt/tomcat/webapps/ROOT/assets/user-profile.js:ro
      - ../../fabricnavigator-rootfs/opt/apache-tomcat-8.0.36/webapps/ROOT/assets/user-profile.css:/opt/tomcat/webapps/ROOT/assets/user-profile.css:ro
      - ../../fabricnavigator-rootfs/opt/apache-tomcat-8.0.36/webapps/ROOT/assets/topology-group.svg:/opt/tomcat/webapps/ROOT/assets/topology-group.svg:ro
      - ../../fabricnavigator-rootfs/opt/apache-tomcat-8.0.36/webapps/ROOT/assets/security.css:/opt/tomcat/webapps/ROOT/assets/security.css:ro
      - ../../fabricnavigator-rootfs/opt/apache-tomcat-8.0.36/webapps/ROOT/assets/setup-wizard.js:/opt/tomcat/webapps/ROOT/assets/setup-wizard.js:ro
